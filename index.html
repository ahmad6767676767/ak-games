<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #4caf50;
        }

        #score-board {
            font-size: 1.2rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        #score {
            color: #4caf50;
            font-weight: bold;
        }

        #high-score {
            color: #ff9800;
            font-weight: bold;
        }

        canvas {
            background-color: #000000;
            border: 4px solid #4caf50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            border-radius: 4px;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div id="score-board">Score: <span id="score">0</span> | High Score: <span id="high-score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls-hint">Use <b>Arrow Keys</b> or <b>WASD</b> to move</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        document.getElementById("high-score").innerText = highScore;

        let gameInterval;
        const gameSpeed = 100; // Milliseconds per frame

        // Main game logic loop
        function main() {
            if (hasGameEnded()) {
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    document.getElementById("high-score").innerText = highScore;
                }
                alert(`Game Over! Your score: ${score}`);
                resetGame();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        // Initialize / Start Game
        resetGame();

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            generateFood();
            dx = 1;
            dy = 0;
            score = 0;
            document.getElementById("score").innerText = score;
            clearInterval(gameInterval);
            gameInterval = setInterval(main, gameSpeed);
        }

        function clearCanvas() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is brighter green, body is regular green
                ctx.fillStyle = index === 0 ? "#66bb6a" : "#4caf50";
                ctx.strokeStyle = "#1b5e20";
                
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check if snake ate the food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }
        }

        function drawFood() {
            ctx.fillStyle = "#f44336";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#f44336";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0; // Reset shadow for snake performance
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Ensure food doesn't spawn on top of the snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function hasGameEnded() {
            // Wall collisions
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) {
                return true;
            }
            // Self collisions (skip head index 0)
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
                    return true;
                }
            }
            return false;
        }

        // Keyboard Controls
        window.addEventListener("keydown", e => {
            const key = e.key.toLowerCase();
            
            // Prevent scrolling with arrows/space keys
            if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key)) {
                e.preventDefault();
            }

            if ((key === "arrowup" || key === "w") && dy === 0) {
                dx = 0;
                dy = -1;
            }
            if ((key === "arrowdown" || key === "s") && dy === 0) {
                dx = 0;
                dy = 1;
            }
            if ((key === "arrowleft" || key === "a") && dx === 0) {
                dx = -1;
                dy = 0;
            }
            if ((key === "arrowright" || key === "d") && dx === 0) {
                dx = 1;
                dy = 0;
            }
        });
    </script>
</body>
</html>
